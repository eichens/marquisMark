<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Paper body with folded top-right corner -->
  <path d="M40 24
           L184 24
           L232 72
           L232 232
           L40 232
           Z"
        fill="#ffffff"
        stroke="#1f2937"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Folded corner (triangle flap) -->
  <path d="M184 24
           L184 72
           L232 72
           Z"
        fill="#e5e7eb"
        stroke="#1f2937"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Page content: YAML-style frontmatter then body -->
  <g stroke="#1f2937" stroke-linecap="round">
    <!-- Top dash row: three dashes -->
    <g stroke-width="5">
      <line x1="64"  y1="70" x2="84"  y2="70"/>
      <line x1="92"  y1="70" x2="112" y2="70"/>
      <line x1="120" y1="70" x2="140" y2="70"/>
    </g>

    <!-- Frontmatter lines (smaller/thinner to read as small text) -->
    <g stroke-width="4">
      <line x1="72" y1="92"  x2="160" y2="92"/>
      <line x1="72" y1="108" x2="180" y2="108"/>
      <line x1="72" y1="124" x2="148" y2="124"/>
      <line x1="72" y1="140" x2="172" y2="140"/>
    </g>

    <!-- Bottom dash row: three dashes -->
    <g stroke-width="5">
      <line x1="64"  y1="162" x2="84"  y2="162"/>
      <line x1="92"  y1="162" x2="112" y2="162"/>
      <line x1="120" y1="162" x2="140" y2="162"/>
    </g>
  </g>

  <!-- Rook chess piece overlay (outline only, slim, bottom-right) -->
  <g transform="translate(172, 158)"
     fill="none"
     stroke="#1f2937"
     stroke-width="2"
     stroke-linejoin="miter"
     stroke-linecap="butt">
    <!-- Base plinth -->
    <path d="M4 58 L46 58 L48 62 L2 62 Z"/>
    <!-- Base tier -->
    <path d="M8 52 L42 52 L42 58 L8 58 Z"/>
    <!-- Tapered body -->
    <path d="M14 26 L36 26 L40 52 L10 52 Z"/>
    <!-- Battlements -->
    <path d="M10 26 L8 8 L17 8 L17 14
             L20.5 14 L20.5 8 L29.5 8 L29.5 14
             L33 14 L33 8 L42 8 L40 26 Z"/>
  </g>
</svg>
